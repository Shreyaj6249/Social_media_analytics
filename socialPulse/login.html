<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SocialPulse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <div class="auth-box">
        <h2>Welcome back</h2>
        <p class="auth-subtitle">Login to your SocialPulse account</p>

        <!-- Message from JavaScript appears here -->
        <p id="messageBox" class="message-box"></p>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="text" id="email" placeholder="demo@gmail.com">
            <p class="error-text" id="emailError"></p>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password">
            <p class="error-text" id="passwordError"></p>
        </div>

        <button type="button" id="loginBtn" class="btn btn-primary full-btn">Login</button>

        <p class="auth-link">Don't have an account? <a href="register.html">Register</a></p>
        <p class="auth-link"><a href="index.html">Back to Home</a></p>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
